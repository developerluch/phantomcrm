<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Hood outline: pointed top, wider base -->
  <path d="M32 6 L18 22 L18 50 L46 50 L46 22 Z" fill="none"/>
  <!-- Inner hood opening (face shadow) -->
  <path d="M32 12 L24 24 L24 44 L40 44 L40 24 Z" fill="currentColor" fill-opacity="0.08"/>
  <!-- Left eye: angular, slanted -->
  <path d="M27 28 L31 31 L29 33 L26 31 Z" fill="currentColor" stroke="none"/>
  <!-- Right eye: angular, slanted (mirrored) -->
  <path d="M37 28 L33 31 L35 33 L38 31 Z" fill="currentColor" stroke="none"/>
  <!-- Cloak base sweep -->
  <path d="M18 50 L14 56 L20 58 L22 54" fill="none"/>
  <path d="M46 50 L50 56 L44 58 L42 54" fill="none"/>
  <!-- Circuit traces flowing down from cloak base -->
  <path d="M24 50 L24 60 M28 50 L28 64 M32 50 L32 68 M36 50 L36 64 M40 50 L40 60"/>
  <!-- Nodes on traces -->
  <circle cx="24" cy="60" r="1.2" fill="currentColor" stroke="none"/>
  <circle cx="28" cy="64" r="1.2" fill="currentColor" stroke="none"/>
  <circle cx="32" cy="68" r="1.2" fill="currentColor" stroke="none"/>
  <circle cx="36" cy="64" r="1.2" fill="currentColor" stroke="none"/>
  <circle cx="40" cy="60" r="1.2" fill="currentColor" stroke="none"/>
  <!-- Horizontal connecting line at bottom -->
  <path d="M14 72 L50 72"/>
  <!-- End-cap dots on horizontal line -->
  <circle cx="14" cy="72" r="1.2" fill="currentColor" stroke="none"/>
  <circle cx="50" cy="72" r="1.2" fill="currentColor" stroke="none"/>
</svg>
