name: Bug report
description: Report a reproducible Phantom CRM defect
body:
  - type: markdown
    attributes:
      value: Do not include credentials or customer data. Report security issues privately through SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps using synthetic data.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision or version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system
    validations:
      required: true
